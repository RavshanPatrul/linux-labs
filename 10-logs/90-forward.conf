# /etc/rsyslog.d/90-forward.conf — копирование всех логов на сервер logserver
# (клон системы в WSL2; оба дистрибутива работают в одной сети, сервер слушает TCP 514)
*.* action(type="omfwd" target="127.0.0.1" port="514" protocol="tcp"
           queue.type="LinkedList" queue.filename="fwd_logserver"
           action.resumeRetryCount="-1" queue.saveOnShutdown="on")
