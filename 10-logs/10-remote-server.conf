# /etc/rsyslog.d/10-remote-server.conf — приём логов с удалённых хостов (TCP 514)
module(load="imtcp")
input(type="imtcp" port="514" ruleset="remote")

# /var/log/rsyslog/<хост>/<программа>.log
template(name="PerProgram" type="string" string="/var/log/rsyslog/%HOSTNAME%/%PROGRAMNAME%.log")
# отдельные файлы по уровням важности
template(name="LvlErr"     type="string" string="/var/log/rsyslog/%HOSTNAME%/levels/err.log")
template(name="LvlWarning" type="string" string="/var/log/rsyslog/%HOSTNAME%/levels/warning.log")
template(name="LvlInfo"    type="string" string="/var/log/rsyslog/%HOSTNAME%/levels/info.log")

ruleset(name="remote") {
    action(type="omfile" dynaFile="PerProgram" dirCreateMode="0750" fileCreateMode="0640")
    if $syslogseverity <= 3 then {
        action(type="omfile" dynaFile="LvlErr")          # emerg, alert, crit, err
    } else if $syslogseverity == 4 then {
        action(type="omfile" dynaFile="LvlWarning")      # warning
    } else if $syslogseverity == 6 then {
        action(type="omfile" dynaFile="LvlInfo")         # info
    }
    stop
}
